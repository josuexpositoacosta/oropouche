
spring.application.name=oropouche

# Valores locales (contraseñas, claves) fuera de Git. Ver application-local.properties.example
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:oropouchedb}?userSSL=false&useUnicode=true&characterEncoding=UTF-8&useLegacyDatetimeType=false&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.mvc.allow-cors=true

# desabilitado
debug=false
#spring.devtools.restart.enabled=false


spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# application.properties
logging.level.org.springframework=DEBUG
logging.level.com.oropouche.tasks=DEBUG

## External API
external.services.jsonplaceholder.base-url=https://jsonplaceholder.typicode.com

## JWT
# Clave HMAC en Base64 (mínimo 256 bits). Generar con: openssl rand -base64 32
# Obligatoria: definir la variable de entorno JWT_SECRET (o ponerla en application-local.properties).
jwt.secret=${JWT_SECRET}
# Validez del token: 24 horas
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
